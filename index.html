<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff5fa2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="العروسة">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<title>العروسة 👰</title>
<style>
:root{--pink:#ff5fa2;--pink2:#ffb3d1;--lav:#a97cff;--ink:#5a1f47;--gold:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#ffe3f0;font-family:"Cairo",system-ui,Tahoma,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.hidden{display:none!important}

/* ---------- start screen ---------- */
.screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#start{background:radial-gradient(circle at 50% 30%,#fff 0,#ffd6ea 40%,#e7c9ff 100%)}
#start .big{font-size:110px;line-height:1;animation:float 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 18px #ff5fa255)}
#start h1{margin:10px 0 0;font-size:54px;font-weight:800;color:var(--pink);text-shadow:0 3px 0 #fff,0 6px 16px #ff5fa255}
#start p{margin:6px 0 26px;font-size:18px;opacity:.85}
.cta{background:linear-gradient(180deg,#ff7ab6,#ff3d8f);color:#fff;font-size:26px;font-weight:800;padding:14px 46px;border-radius:999px;box-shadow:0 8px 0 #c71f6a,0 14px 30px #ff3d8f66;animation:pulse 1.6s infinite}
.cta:active{transform:translateY(4px);box-shadow:0 4px 0 #c71f6a}
#installBtn{margin-top:22px;background:#fff;padding:10px 22px;border-radius:999px;font-size:17px;font-weight:800;box-shadow:0 4px 14px #a97cff44}
#iosHint{margin-top:18px;font-size:15px;background:#ffffffcc;padding:10px 14px;border-radius:14px;max-width:320px}
.hearts-bg span{position:absolute;font-size:22px;opacity:.5;animation:rise 7s linear infinite}

/* ---------- main app ---------- */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
header{padding:calc(env(safe-area-inset-top) + 8px) 10px 4px;display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#ffd0e6,#ffd0e600)}
.steps{flex:1;display:flex;justify-content:center;gap:7px}
.dot{width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid #f7c6dd;display:grid;place-items:center;font-size:21px;opacity:.45;transition:.25s;padding:0}
.dot.done{opacity:1;border-color:#7ed6a5}
.dot.cur{opacity:1;border-color:var(--pink);transform:scale(1.15);box-shadow:0 0 0 4px #ff5fa233}
.iconbtn{width:42px;height:42px;border-radius:50%;background:#fff;font-size:20px;box-shadow:0 3px 10px #ff5fa230}
#stage{flex:1;position:relative;min-height:0;touch-action:none;overflow:hidden;transition:background .5s}
#stage.s0{background:repeating-linear-gradient(0deg,#d8f1ff 0 38px,#c4e6fa 38px 40px),#d8f1ff;background:linear-gradient(#ffffff55,#ffffff00),repeating-linear-gradient(90deg,transparent 0 38px,#b6dcf2 38px 40px),repeating-linear-gradient(0deg,#ddf3ff 0 38px,#b6dcf2 38px 40px)}
#stage.s1{background:radial-gradient(circle at 50% 40%,#fff 0,#ffe0ef 55%,#ffc4df 100%)}
#stage.s2{background:radial-gradient(circle at 50% 30%,#fff7fb 0,#ffe3f1 60%,#f6d0ff 100%)}
#stage.s3{background:radial-gradient(circle at 50% 35%,#fffaf2 0,#ffe9d6 60%,#ffd2c2 100%)}
#stage.s4{background:radial-gradient(circle at 50% 40%,#f3fbff 0,#e2ecff 55%,#e7d6ff 100%)}
#doll{width:100%;height:100%;display:block}
#cursor{position:absolute;pointer-events:none;display:none;z-index:5;font-size:64px;line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 8px #0003)}
#cursor.dryer{transform:translate(-6px,-50%)}
.bub{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 30%,#fff,#e6f6ff 60%,#bfe3ff);border:1px solid #9fd2ff;animation:bub 1.1s ease-out forwards;z-index:4}
.air{position:absolute;pointer-events:none;width:26px;height:8px;border-radius:8px;background:linear-gradient(90deg,#ffffff00,#fff,#ffd9b0aa);animation:air .6s linear forwards;z-index:4}
.drop{position:absolute;top:-30px;width:6px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:linear-gradient(#bfe6ff,#4fb3ff);animation:fall .9s linear forwards;pointer-events:none;z-index:4}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;padding:6px 16px;border-radius:999px;font-weight:800;box-shadow:0 4px 14px #ff5fa244;white-space:nowrap;z-index:6;animation:pop .35s}

#panel{background:#fffffff2;border-radius:26px 26px 0 0;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);box-shadow:0 -8px 28px #c0408022;max-height:46vh;overflow-y:auto;position:relative}
.hint{text-align:center;font-weight:800;font-size:17px;margin:2px 0 8px}
.bar{height:14px;background:#ffe3f0;border-radius:99px;overflow:hidden;margin:0 6px 10px;border:2px solid #ffc6df}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ee3ff,#ff7ab6);border-radius:99px;transition:width .2s}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 8px;scroll-snap-type:x mandatory}
.scroll::-webkit-scrollbar{display:none}
.tool{min-width:96px;padding:6px 12px;background:#fff;border-radius:20px;border:3px solid #ffd0e6;font-size:34px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tool span{font-size:14px;font-weight:800}
.tool.on{border-color:var(--pink);background:#fff0f7}
.tool:disabled{opacity:.35}
.tool.glow{animation:pulse 1.2s infinite}
.card{flex:0 0 96px;scroll-snap-align:center;background:#fff;border:3px solid #f6d5e6;border-radius:18px;padding:4px;text-align:center;font-size:12.5px;font-weight:800}
.card svg{width:100%;height:96px;display:block}
.card.on{border-color:var(--pink);box-shadow:0 0 0 3px #ff5fa233}
.chip{background:#fff;border:3px solid #f0d6ff;border-radius:999px;padding:6px 12px;font-size:15px;font-weight:800}
.chip.on{border-color:var(--lav);background:#f6efff}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:999px;background:#fff0f7;font-weight:800;font-size:14.5px}
.tab.on{background:var(--pink);color:#fff}
.sw{width:48px;height:48px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #f2c6dc;position:relative}
.sw.on{box-shadow:0 0 0 4px var(--pink)}
.sw.none{background:#fff!important;font-size:20px}
.lens{width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #cfd8ee;display:grid;place-items:center}
.lens i{display:block;width:20px;height:20px;border-radius:50%;background:#111;box-shadow:inset 3px -3px 0 #333,0 0 0 5px #0002}
.lens.on{box-shadow:0 0 0 4px var(--lav)}
.label{font-size:13px;font-weight:800;opacity:.7;text-align:center;margin:8px 0 6px}
#next{display:block;width:100%;margin-top:10px;padding:12px;border-radius:18px;background:linear-gradient(180deg,#ff7ab6,#ff3d8f);color:#fff;font-size:21px;font-weight:800;box-shadow:0 5px 0 #c71f6a}
#next:disabled{background:#f3d4e4;box-shadow:0 5px 0 #e6b9cf;color:#fff}
#next.show{background:linear-gradient(180deg,#ffd76a,#ff9f1c);box-shadow:0 5px 0 #c96e00;animation:pulse 1.3s infinite;font-size:24px}

/* ---------- runway ---------- */
#show{background:#12061f;padding:0}
#runway{position:absolute;inset:0;width:100%;height:100%}
#showTitle{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;color:#fff;font-weight:800;font-size:20px;text-shadow:0 0 12px #ff5fa2;z-index:3}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#12061f88;z-index:4}
.rcard{background:#fff;border-radius:28px;padding:22px 26px;text-align:center;box-shadow:0 20px 60px #0008;animation:pop .45s;max-width:330px}
.rcard h2{margin:0;font-size:32px;color:var(--pink)}
.rcard .stars{font-size:40px;margin:6px 0;letter-spacing:4px}
.rcard p{margin:4px 0 16px;font-size:17px}
.rcard button{display:block;width:100%;margin-top:10px;padding:12px;border-radius:16px;font-size:19px;font-weight:800}
.b1{background:linear-gradient(180deg,#ffd76a,#ff9f1c);color:#fff;box-shadow:0 4px 0 #c96e00}
.b2{background:#fff0f7;color:var(--ink);box-shadow:0 4px 0 #f2c6dc}
.fly{position:absolute;pointer-events:none;z-index:3;animation:flyup 2.4s ease-out forwards;font-size:28px}
.conf{position:absolute;top:-20px;width:10px;height:16px;pointer-events:none;z-index:5;animation:confetti linear forwards}
.bulb{animation:tw 1s ease-in-out infinite alternate}
.spot{transform-box:view-box;animation:sweep 4s ease-in-out infinite alternate}
.stink{animation:stink 1.6s ease-in-out infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:spk .8s ease-out forwards}

@keyframes float{50%{transform:translateY(-12px)}}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{opacity:1}}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.6}100%{transform:translateY(-110vh);opacity:0}}
@keyframes bub{0%{transform:scale(.3);opacity:1}100%{transform:translateY(-70px) scale(1.2);opacity:0}}
@keyframes air{0%{opacity:.9}100%{transform:translateX(-90px) scaleX(1.6);opacity:0}}
@keyframes fall{to{transform:translateY(120vh)}}
@keyframes flyup{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-260px) scale(1.3);opacity:0}}
@keyframes confetti{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes tw{from{opacity:.35}to{opacity:1}}
@keyframes sweep{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes stink{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-8px);opacity:.4}}
@keyframes spk{0%{transform:scale(0) rotate(0);opacity:1}60%{transform:scale(1.5) rotate(45deg);opacity:1}100%{transform:scale(.2) rotate(90deg);opacity:0}}
</style>
</head>
<body>

<!-- shared gradients -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
 <linearGradient id="gWhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efe6f5"/></linearGradient>
 <linearGradient id="gChamp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6e8"/><stop offset="1" stop-color="#e8c99a"/></linearGradient>
 <linearGradient id="gPink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd6ea"/><stop offset="1" stop-color="#ff86c0"/></linearGradient>
 <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".5" stop-color="#f2c447"/><stop offset="1" stop-color="#c98d14"/></linearGradient>
 <linearGradient id="gLav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e6ff"/><stop offset="1" stop-color="#b08ef0"/></linearGradient>
 <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b8b"/><stop offset="1" stop-color="#b3123b"/></linearGradient>
 <linearGradient id="gRobe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd0e5"/><stop offset="1" stop-color="#ff9ccb"/></linearGradient>
 <linearGradient id="gTiara" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5c0"/><stop offset="1" stop-color="#e0a516"/></linearGradient>
 <radialGradient id="irisShade"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
 <radialGradient id="faceGlow" cx=".5" cy=".4"><stop offset="0" stop-color="#fde2cf"/><stop offset="1" stop-color="#f4c7a8"/></radialGradient>
</defs>
</svg>

<!-- START -->
<div id="start" class="screen">
  <div class="hearts-bg" id="heartsBg"></div>
  <div class="big">👰‍♀️</div>
  <h1>العروسة</h1>
  <p>نظّفيها، لبّسيها، زيّنيها… وخلّيها تمشي على المسرح!</p>
  <button class="cta" id="playBtn">ابدئي اللعب 💖</button>
  <button id="installBtn" class="hidden">📲 ثبّتي اللعبة على الجوال</button>
  <div id="iosHint" class="hidden">للتثبيت على الآيفون: اضغطي زر المشاركة <b>⬆️</b> ثم <b>«إضافة إلى الشاشة الرئيسية»</b></div>
</div>

<!-- GAME -->
<div id="app">
  <header>
    <button class="iconbtn" id="muteBtn" aria-label="الصوت">🔊</button>
    <div class="steps" id="steps"></div>
    <button class="iconbtn" id="homeBtn" aria-label="البداية">🏠</button>
  </header>
  <div id="stage" class="s0">
    <svg id="doll" viewBox="0 0 300 560" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="cursor"></div>
  </div>
  <div id="panel"></div>
</div>

<!-- SHOW -->
<div id="show" class="screen hidden">
  <svg id="runway" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice"></svg>
  <div id="showTitle">✨ العروسة على المسرح ✨</div>
  <div id="result" class="hidden">
    <div class="rcard">
      <h2>👑 ملكة المسرح!</h2>
      <div class="stars">⭐⭐⭐⭐⭐</div>
      <p>العروسة طلعت تجنن 😍</p>
      <button class="b1" id="replayBtn">🔁 تمشي مرة ثانية</button>
      <button class="b2" id="editBtn">💄 أعدّل عليها</button>
      <button class="b2" id="newBtn">👰 عروسة جديدة</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,amt){let c=parseInt(hex.slice(1),16),r=c>>16,g=c>>8&255,b=c&255;const f=amt<0?0:255,p=Math.abs(amt);r=Math.round(r+(f-r)*p);g=Math.round(g+(f-g)*p);b=Math.round(b+(f-b)*p);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
const f1=n=>n.toFixed(1);

/* ================= SOUND ================= */
let AC=null,master=null,muted=false;
try{muted=localStorage.getItem('bride-muted')==='1'}catch(e){}
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.12,type='sine',v=.15,when=0){const a=ac();if(!a)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
let NB=null;function noiseBuf(){const a=ac();if(!NB){NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return NB}
function noise(d,freq,type='bandpass',v=.1,when=0){const a=ac();if(!a)return;const t=a.currentTime+when,s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=noiseBuf();fl.type=type;fl.frequency.value=freq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(master);s.start(t,Math.random());s.stop(t+d+.05)}
const sfx={
 click(){tone(880,.07,'triangle',.08)},
 pop(){tone(500+Math.random()*600,.07,'sine',.09)},
 chime(){[1047,1319,1568,2093].forEach((f,i)=>tone(f,.35,'triangle',.07,i*.07))},
 squish(){noise(.08,1800,'bandpass',.05)},
 shower(){noise(1.8,3500,'lowpass',.12)},
 applause(){for(let i=0;i<70;i++)noise(.05+Math.random()*.05,1500+Math.random()*2500,'bandpass',.12,Math.random()*2.6)},
 kiss(){tone(1400,.08,'sine',.1);tone(1800,.1,'sine',.08,.06)}
};
let loopSrc=null,loopGain=null;
function startLoop(kind){const a=ac();if(!a||loopSrc)return;loopSrc=a.createBufferSource();loopSrc.buffer=noiseBuf();loopSrc.loop=true;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=kind==='dryer'?900:2500;fl.Q.value=.6;loopGain=a.createGain();loopGain.gain.value=kind==='dryer'?.09:.04;loopSrc.connect(fl).connect(loopGain).connect(master);loopSrc.start()}
function stopLoop(){if(loopSrc){try{loopSrc.stop()}catch(e){}loopSrc=null}}
let musicTimer=null,musicStep=0,nextNoteT=0;
function startMusic(){const a=ac();if(!a||musicTimer)return;musicStep=0;nextNoteT=a.currentTime+.1;const spb=60/116/4;
 const bass=[110,110,87.31,87.31,130.81,130.81,98,98],arp=[[440,523.25,659.25],[349.23,440,523.25],[523.25,659.25,783.99],[392,493.88,587.33]];
 musicTimer=setInterval(()=>{while(nextNoteT<a.currentTime+.12){const s=musicStep%16,bar=Math.floor(musicStep/16)%4,w=nextNoteT-a.currentTime;
  if(s%4===0){const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(140,nextNoteT);o.frequency.exponentialRampToValueAtTime(40,nextNoteT+.15);g.gain.setValueAtTime(.35,nextNoteT);g.gain.exponentialRampToValueAtTime(.001,nextNoteT+.18);o.connect(g).connect(master);o.start(nextNoteT);o.stop(nextNoteT+.2)}
  if(s%4===2)noise(.04,8000,'highpass',.05,w);
  if(s===4||s===12)noise(.12,1600,'bandpass',.12,w);
  if(s%2===0)tone(bass[bar*2+(s>7?1:0)],.18,'sawtooth',.05,w);
  if(s%2===1)tone(arp[bar][(s>>1)%3]*(s>8?2:1),.16,'triangle',.05,w);
  musicStep++;nextNoteT+=spb}},25)}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}
function setMuted(m){muted=m;try{localStorage.setItem('bride-muted',m?'1':'0')}catch(e){}if(master)master.gain.value=m?0:1;$('#muteBtn').textContent=m?'🔇':'🔊'}

/* ================= DATA ================= */
const SKIN='#f8d5bc',SKIN2='#e9b394';
const STEPS=[{ic:'🛁',n:'الحمّام'},{ic:'👗',n:'الفستان'},{ic:'💄',n:'المكياج'},{ic:'💇‍♀️',n:'الشعر'},{ic:'👁️',n:'العدسات'}];
const LIPS=['#d98b8b','#ff6fa8','#e0245e','#b3123b','#c8735f','#9b2c6e'];
const SHADOWS=[null,'#f7a8d0','#c49bff','#ffd27a','#8fd3ff','#c28f6b'];
const BLUSH=[null,'#ff9fb8','#ff7f7f','#ffb07a'];
const LENS=[{c:'#6b4428',n:'بني'},{c:'#3a8dde',n:'أزرق'},{c:'#35a865',n:'أخضر'},{c:'#8d9aa6',n:'رمادي'},{c:'#cf8f2c',n:'عسلي'},{c:'#9b59d0',n:'بنفسجي'}];
const HAIRC=['#2a1d1a','#5a3420','#8a5530','#e3b45e','#a8432a','#f29bc0'];
const DIRT=[[124,142,11],[180,100,10],[160,166,8],[150,186,9],[106,262,12],[197,300,11],[100,330,10],[142,240,13],[166,330,14],[128,385,12],[180,395,10],[140,450,11],[160,490,10],[139,505,9],[118,90,9],[192,240,10]];

const S={};
function resetState(){Object.assign(S,{step:0,max:0,clean:false,rinsed:false,dress:null,acc:{tiara:false,veil:false,jewel:false,bouquet:false},lip:'#d98b8b',shadow:null,blush:null,lashes:false,liner:false,hairP:0,hairColor:'#5a3420',hairStyle:'long',lens:'#6b4428',mkTab:'lip',dirt:[]})}

/* ================= DOLL ================= */
const BOD='M120,206 Q135,196 150,210 Q165,196 180,206 L175,294 L125,294 Z';
function qpt(t,a,c,b){return(1-t)*(1-t)*a+2*t*(1-t)*c+t*t*b}
function sash(col,gem){return`<path d="M124,284 Q150,292 176,284 L177,298 Q150,306 123,298Z" fill="${col}"/><circle cx="150" cy="295" r="5.5" fill="${gem}" stroke="#fff" stroke-width="2"/>`}

$('#playBtn').onclick=()=>{ac();sfx.chime();$('#start').classList.add('hidden')};
$('#homeBtn').onclick=()=>{sfx.click();if(confirm('تبين تبدين عروسة جديدة من البداية؟')){newGame();$('#start').classList.remove('hidden')}};
$('#muteBtn').onclick=()=>{ac();setMuted(!muted);sfx.click()};
setMuted(muted);
(function hearts(){const h=$('#heartsBg');for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=['💖','🌸','✨','💕'][i%4];s.style.left=Math.random()*100+'%';s.style.bottom='-40px';s.style.animationDelay=(Math.random()*7)+'s';h.appendChild(s)}})();
newGame();

/* ================= INSTALL (PWA) ================= */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBtn').classList.remove('hidden')});
$('#installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#installBtn').classList.add('hidden')};
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(isIOS&&!standalone)$('#iosHint').classList.remove('hidden');
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
