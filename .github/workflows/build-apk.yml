name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p app/www
          cp index.html manifest.webmanifest sw.js *.png app/www/

      - name: Create Android project
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "بستان التسبيح" com.bustan.tasbih --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set app icon
        working-directory: app/android/app/src/main/res
        run: |
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do
            cp "$GITHUB_WORKSPACE/icon-192.png" "$d/ic_launcher.png"
            cp "$GITHUB_WORKSPACE/icon-192.png" "$d/ic_launcher_round.png"
          done

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bustan-altasbih-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
